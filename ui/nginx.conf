server {
  listen 80;
  server_name _;

  # Docker embedded DNS: resolve upstream at request time (policy-api may not exist at nginx start).
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    client_max_body_size 100m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 660s;
    proxy_read_timeout 660s;
    set $policy_api policy-api;
    # With a variable host, include $request_uri so the path is preserved (otherwise /api/v1/... may become wrong and return 404).
    proxy_pass http://$policy_api:8082$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri /index.html;
  }
}
