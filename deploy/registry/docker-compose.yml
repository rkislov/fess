# Локальный Docker Registry (pull анонимно, push по паролю).
# Запуск на сервере:
#   cd deploy/registry
#   # htpasswd уже в auth/htpasswd (см. README)
#   docker compose up -d
#
# Адрес: http://<host>:5000
# На Docker-клиентах с HTTP: insecure-registries → ["<host>:5000"]

version: "2.4"

services:
  registry:
    container_name: fess-registry
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-fess-registry-http-secret-change-me}
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - registry_net

  registry-proxy:
    container_name: fess-registry-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      registry:
        condition: service_started
    ports:
      - "${REGISTRY_HOST_PORT:-5000}:5000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth/htpasswd:/etc/nginx/htpasswd:ro
    networks:
      - registry_net

volumes:
  registry_data:

networks:
  registry_net:
    driver: bridge
