# Pull (GET/HEAD) — без пароля.
# Push / delete (остальные методы) — Basic Auth из /etc/nginx/htpasswd.

upstream docker_registry {
    server registry:5000;
}

server {
    listen 5000;
    server_name _;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location /v2/ {
        proxy_pass                          http://docker_registry;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout                  900s;
        proxy_request_buffering             off;

        limit_except GET HEAD {
            auth_basic           "FESS Docker Registry";
            auth_basic_user_file /etc/nginx/htpasswd;
        }
    }

    location = / {
        return 200 'FESS Docker Registry\n';
        add_header Content-Type text/plain;
    }
}
