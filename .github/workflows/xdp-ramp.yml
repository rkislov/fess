name: Same-host XDP PPS ramp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ramp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PPS_LEVELS: 50000,100000,200000,400000,800000,1600000
      PROBE_SECONDS: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries on this runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang iproute2 iptables
          BPF_CLANG=/usr/bin/clang scripts/build-xdp.sh
          mkdir -p dist
          go build -o dist/fess ./cmd/fess
          go build -o dist/fess-xdp ./cmd/fess-xdp
          go build -o dist/fess-load ./cmd/fess-load
          go build -o dist/fess-rawload ./benchmarks/rawload
          go build -o dist/fess-xdpstats ./benchmarks/xdpstats
      - name: Ramp repeat 1, off then on, generator CPU 0, service CPUs 1-3
        run: sudo python3 benchmarks/xdp-linux.py --mode native --levels "$PPS_LEVELS" --seconds "$PROBE_SECONDS" --generator-cpus 0 --repeats 1 --repeat-offset 0 --output benchmarks/xdp-ramp-repeat-1.json > benchmarks/xdp-ramp-repeat-1.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdp-ramp-repeat-1
          path: benchmarks/xdp-ramp-repeat-1.*
      - name: Ramp repeat 2, on then off, same runner and CPU affinity
        run: sudo python3 benchmarks/xdp-linux.py --mode native --levels "$PPS_LEVELS" --seconds "$PROBE_SECONDS" --generator-cpus 0 --repeats 1 --repeat-offset 1 --output benchmarks/xdp-ramp-repeat-2.json > benchmarks/xdp-ramp-repeat-2.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdp-ramp-repeat-2
          path: benchmarks/xdp-ramp-repeat-2.*
      - name: Ramp repeat 3, off then on, same runner and CPU affinity
        run: sudo python3 benchmarks/xdp-linux.py --mode native --levels "$PPS_LEVELS" --seconds "$PROBE_SECONDS" --generator-cpus 0 --repeats 1 --repeat-offset 2 --output benchmarks/xdp-ramp-repeat-3.json > benchmarks/xdp-ramp-repeat-3.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdp-ramp-repeat-3
          path: benchmarks/xdp-ramp-repeat-3.*
