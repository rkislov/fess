name: Release native FESS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version without v prefix
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify embedded XDP bytecode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          BPF_CLANG=/usr/bin/clang scripts/build-xdp.sh
          go test -c -o /tmp/fess-xdp.test ./internal/xdpguard
          sudo env FESS_TEST_XDP=1 /tmp/fess-xdp.test -test.v
      - name: Install package builder
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
      - name: Build releases
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          export FESS_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/release.sh
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          out="dist/releases/$version"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$out"/*.tar.gz "$out"/*.deb "$out"/*.rpm "$out"/SHA256SUMS --clobber
          else
            gh release create "v$version" "$out"/*.tar.gz "$out"/*.deb "$out"/*.rpm "$out"/SHA256SUMS --title "FESS $version" --generate-notes --target "$GITHUB_SHA"
          fi

  verify-ubuntu:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/ubuntu-packages.yml
    with:
      tag: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

  verify-source:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from the published source bundle and exercise SQLite and UI
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          root="$RUNNER_TEMP/fess-from-source"
          python3 scripts/install-linux.py --source --prefix "$root" "$version"
          "$root/current/start-fess" &
          pid=$!
          trap 'kill "$pid"' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8082/healthz
          curl -fsS http://127.0.0.1:8082/ | grep '/_nuxt/'
          test -s "$root/data/fess.db"
